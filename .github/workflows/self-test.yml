name: self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 37-factor registry
        run: python .agents/skills/recursive-governance-37/scripts/validate_registry.py
      - name: Run skill self-test
        run: python .agents/skills/recursive-governance-37/tests/self_test.py
